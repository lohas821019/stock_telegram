[Telegram]
# 你的 Telegram Bot Token
token = YOUR_TELEGRAM_BOT_TOKEN
# 你的 Telegram Chat ID (個人或群組)
chat_id = YOUR_TELEGRAM_CHAT_ID

[Settings]
# 掃描間隔 (秒)，避免被 yfinance 封鎖
delay = 1
max_workers = 8

# RSI alert rules. Alerts are sent only when entering or leaving a zone.
rsi_period = 14
rsi_oversold = 30
rsi_overbought = 70

# SMC chart sending options
# smc_send_charts: true / false
# smc_send_telegram: true / false（false = 僅更新 SMC 網頁，不傳 Telegram）
# smc_chart_direction: all / bullish / bearish
#   all     = send charts for any BOS/CHoCH breakout
#   bullish = send charts only for bullish breakouts
#   bearish = send charts only for bearish breakouts
# smc_chart_timeframe: auto / 1D / 1W
# smc_chart_bars: number of candles shown in the chart
smc_send_telegram = false
smc_send_charts = true
smc_chart_direction = all
smc_chart_timeframe = auto
smc_chart_bars = 120
# 每次 SMC 掃描後，更新本機 smc_dashboard.html；圖表會存於 smc_dashboard_assets 資料夾。
smc_write_dashboard = true
smc_dashboard_charts = true

[Reports]
# Telegram 要傳送的掃描報告類別（用逗號分隔；移除即不傳送）
# 可用類別：rsi, kd, etf, group, strong, pattern, smc, completion
# smc 僅適用台股；選到後會在台股一般掃描完成後執行 SMC 篩選與圖表通知。
enabled = rsi, kd, etf, pattern, completion

# 可選：針對單一市場覆寫 enabled。取消註解後，該市場只會傳這裡列出的類別。
# tw_enabled = rsi, kd, etf, smc, completion
# us_enabled = rsi, kd, strong, pattern, completion
